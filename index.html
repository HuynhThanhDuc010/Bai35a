<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form đăng ký</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<main class="container">
<form id="registerForm" class="register-form" novalidate>
<h1>Đăng ký tài khoản</h1>
<p class="description">Vui lòng điền thông tin để tạo tài khoản mới.</p>
<div class="form-group">
<label for="name">Họ và tên</label>
<input type="text" id="name" placeholder="Nhập họ và tên" autocomplete="name">
<small class="error" id="nameError"></small>
</div>
<div class="form-group">
<label for="email">Email</label>
<input type="email" id="email" placeholder="example@email.com" autocomplete="email">
<small class="error" id="emailError"></small>
</div>
<div class="form-group">
<label for="password">Mật khẩu</label>
<input type="password" id="password" placeholder="Ít nhất 8 ký tự" autocomplete="new-password">
<small class="hint">Cần có chữ hoa, chữ thường và chữ số.</small>
<small class="error" id="passwordError"></small>
</div>
<div class="terms-row">
<input type="checkbox" id="terms">
<label for="terms">Tôi đồng ý với điều khoản sử dụng.</label>
</div>
<small class="error" id="termsError"></small>
<button type="submit">Đăng ký</button>
<p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
</form>
</main>
</body>
</html>
